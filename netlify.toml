# Netlify site config: publish public/, functions in netlify/functions.
[build]
  publish = "public"
  command = "node scripts/stamp-site-url.mjs"

[functions]
  node_bundler = "esbuild"

# Single-page app: /admin and /<coach-slug> both load index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
