<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach Booking</title>
<meta name="theme-color" content="#0a0a0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: dark "midnight abyss" canvas, glowing aqua-jade line work, condensed athletic display type.
   Baby pink is a dash only: selection handles, small labels, one chip. */
:root {
  --bg: #060a18; --bg-2: #0a1024; --surface: #0e1530; --surface-2: #151e3f; --border: #1f2a52; --border-2: #2b3868;
  --text: #ecf1ff; --muted: #8d98bf; --faint: #5b668f;
  --accent: #2fd4b4; --accent-ink: #032a23; --accent-text: #5ee6cc; --accent-soft: rgba(47, 212, 180, .12);
  --pink: #ffbfd6; --pink-ink: #3a1022; --pink-soft: rgba(255, 191, 214, .12);
  --hot: var(--accent-text); --hot-soft: var(--accent-soft);
  --warn: #ffc66b; --warn-soft: rgba(255, 198, 107, .12); --danger: #ff7a8a; --danger-soft: rgba(255, 122, 138, .12);
  --ok: #5be49b; --ok-soft: rgba(91, 228, 155, .12);
  --radius: 16px; --radius-sm: 10px;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 20px 40px -20px rgba(0,0,0,.6);
  --glow: 0 0 0 1px rgba(47,212,180,.35), 0 10px 40px -10px rgba(47,212,180,.45);
  --display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: var(--accent-text); text-decoration-thickness: 1px; text-underline-offset: 3px; }
h1, h2, h3 { line-height: 1.15; margin: 0 0 .5em; text-wrap: balance; }
h1 { font: 800 clamp(30px, 5vw, 44px)/1 var(--display); text-transform: uppercase; letter-spacing: .005em; }
h2 { font: 800 clamp(26px, 3.6vw, 36px)/1.05 var(--display); text-transform: uppercase; letter-spacing: .01em; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0 0 .75em; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 14px; }
.hidden { display: none !important; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 10px; display: inline-flex; gap: 8px; align-items: center; }
.eyebrow::before { content: ""; width: 18px; height: 2px; background: var(--pink); border-radius: 2px; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(6, 10, 24, .78); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font: 800 20px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; text-decoration: none; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mark { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; background: conic-gradient(from 210deg, var(--accent), #1b8fd6, var(--pink), var(--accent)); box-shadow: 0 0 18px rgba(47,212,180,.5); position: relative; }
.mark::after { content: ""; position: absolute; inset: 7px; border-radius: 3px; background: var(--bg); }
.nav-links { display: flex; gap: 26px; font-size: 14px; font-weight: 600; }
.nav-links a { color: var(--muted); text-decoration: none; cursor: pointer; }
.nav-links a:hover { color: var(--text); }
@media (max-width: 820px) { .nav-links { display: none; } }
header.top button, header.top .btn { white-space: nowrap; flex-shrink: 0; }

/* Buttons and forms */
button, .btn { font: inherit; font-weight: 700; border-radius: 999px; border: 1px solid var(--border-2); background: var(--surface); color: var(--text); padding: 10px 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; transition: background .15s, border-color .15s, box-shadow .15s, transform .15s; }
button:hover, .btn:hover { border-color: var(--accent); }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 8px 24px -10px rgba(47,212,180,.7); }
button.primary:hover, .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 12px 30px -10px rgba(47,212,180,.8); }
button.danger { color: var(--danger); }
button.ghost { background: transparent; border-color: transparent; }
button.ghost:hover { border-color: var(--border-2); }
button.sm, .btn.sm { padding: 6px 12px; min-height: 34px; font-size: 13px; }
button:disabled { opacity: .5; cursor: default; transform: none !important; }
button.block { width: 100%; }
.btn.lg, button.lg { padding: 14px 24px; min-height: 52px; font-size: 16px; }
label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; color: var(--muted); }
input, select, textarea { font: inherit; width: 100%; padding: 11px 13px; border-radius: var(--radius-sm); border: 1px solid var(--border-2); background: var(--bg-2); color: var(--text); }
input::placeholder, textarea::placeholder { color: var(--faint); }
input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea { min-height: 96px; resize: vertical; }
.field { margin-bottom: 14px; }
.fields { display: grid; gap: 0 14px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }

/* Surfaces */
.card { background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
.card + .card { margin-top: 14px; }
.grid > .card, .stats > .card { margin-top: 0; }
.section { margin: 56px 0; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.accent { background: var(--accent-soft); color: var(--accent-text); }
.pill.pink { background: var(--pink-soft); color: var(--pink); }
.price { font: 800 40px/1 var(--display); letter-spacing: .01em; color: var(--text); }
.price small { font: 600 14px var(--body); color: var(--muted); letter-spacing: 0; }
.list { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.item { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.item:first-child { border-top: 0; }
.item .grow { min-width: 180px; }
.item .when { font-weight: 700; }
.empty { padding: 26px 18px; color: var(--muted); text-align: center; }
.banner { padding: 12px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-weight: 600; margin-bottom: 14px; border: 1px solid rgba(255,198,107,.25); }
.banner.ok { background: var(--ok-soft); color: var(--ok); border-color: rgba(91,228,155,.25); }
.banner.info { background: var(--accent-soft); color: var(--accent-text); border-color: rgba(47,212,180,.25); }
.err { color: var(--danger); font-size: 14px; margin: 6px 0 0; min-height: 1em; }
.auth { max-width: 440px; margin: 56px auto; }
footer { padding: 48px 0; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); margin-top: 40px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: top; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }

/* Placeholder images */
.ph { position: relative; overflow: hidden; border-radius: var(--radius); background:
    radial-gradient(120% 80% at 80% 10%, rgba(255,191,214,.35), transparent 55%),
    radial-gradient(90% 90% at 10% 100%, rgba(47,212,180,.45), transparent 60%),
    linear-gradient(160deg, #13204a, #0a1230); min-height: 160px; }
.ph svg.fig { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); height: 86%; width: auto; opacity: .55; }
.ph .ph-label { position: absolute; left: 12px; bottom: 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(236,241,255,.85); background: rgba(6,10,24,.55); padding: 4px 9px; border-radius: 99px; backdrop-filter: blur(6px); }

/* Hero */
.hero { position: relative; margin-top: 20px; border-radius: 28px; border: 1px solid var(--border); overflow: hidden; background:
    radial-gradient(60% 70% at 85% 30%, rgba(47,212,180,.16), transparent 60%),
    radial-gradient(40% 50% at 10% 90%, rgba(30,90,220,.18), transparent 60%),
    linear-gradient(180deg, #08102a, #050816); }
.hero .lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero-inner { position: relative; display: grid; grid-template-columns: 1.15fr .85fr; gap: 24px; padding: clamp(28px, 5vw, 64px) clamp(28px, 5vw, 64px) clamp(56px, 7vw, 88px); align-items: center; }
@media (max-width: 880px) { .hero-inner { grid-template-columns: 1fr; } }
.display { font: 900 clamp(58px, 10.5vw, 132px)/.88 var(--display); text-transform: uppercase; letter-spacing: -.005em; margin: 0 0 22px; }
.display .line { display: block; }
.sel { position: relative; display: inline-block; padding: 0 .12em; margin-left: -.12em; border: 2px solid var(--accent); box-shadow: 0 0 28px rgba(47,212,180,.35), inset 0 0 22px rgba(47,212,180,.12); color: var(--text); }
.sel::before, .sel::after { content: ""; position: absolute; width: 10px; height: 10px; background: var(--pink); border-radius: 2px; }
.sel::before { left: -6px; top: -6px; }
.sel::after { right: -6px; bottom: -6px; }
.lede { font-size: 17px; color: #c3cbea; max-width: 46ch; margin-bottom: 26px; }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }
.hero-meta { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 28px; font-size: 13px; color: var(--muted); }
.hero-meta b { color: var(--text); font: 800 22px/1 var(--display); display: block; letter-spacing: .02em; }

/* Phone mockup */
.stage { position: relative; display: flex; justify-content: center; padding: 10px 0 20px; }
.phone { width: 270px; max-width: 100%; border-radius: 40px; padding: 10px; background: linear-gradient(160deg, #2a3463, #0b1129); box-shadow: 0 40px 80px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.06), 0 0 60px -10px rgba(47,212,180,.35); }
.screen { border-radius: 31px; overflow: hidden; background: var(--bg-2); position: relative; }
.screen .notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 84px; height: 22px; background: #000; border-radius: 99px; z-index: 2; }
.screen .ph { border-radius: 0; height: 190px; }
.screen-body { padding: 14px; }
.screen-body h4 { margin: 0 0 2px; font: 800 20px/1.1 var(--display); text-transform: uppercase; }
.mini-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0; }
.mini-slots span { font-size: 12px; font-weight: 700; text-align: center; padding: 8px 4px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--surface); }
.mini-slots span:first-child { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.float { position: absolute; z-index: 2; border-radius: 14px; padding: 10px 14px; font-size: 13px; font-weight: 700; background: rgba(14,21,48,.86); backdrop-filter: blur(10px); border: 1px solid var(--border-2); box-shadow: 0 20px 40px -18px rgba(0,0,0,.8); }
.float .k { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.float.f1 { left: 0; top: 18%; }
.float.f2 { right: 0; bottom: 18%; border-color: rgba(255,191,214,.4); }
.float.f2 .v { color: var(--pink); }
@media (max-width: 560px) { .float { display: none; } }

/* How it works */
.steps { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); counter-reset: step; }
.step { padding: 22px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-2); }
.step::before { counter-increment: step; content: "0" counter(step); font: 900 44px/1 var(--display); color: transparent; -webkit-text-stroke: 1px var(--accent); display: block; margin-bottom: 14px; }

/* Packages */
.pkg { display: flex; flex-direction: column; gap: 8px; position: relative; }
.pkg .desc { flex: 1; color: #c3cbea; }
.pkg.best { border-color: rgba(47,212,180,.6); box-shadow: var(--glow); }
.pkg .tag { position: absolute; top: 16px; right: 16px; }
.pkg .per { font-size: 13px; color: var(--muted); }
.pkg .per b { color: var(--accent-text); }
.band { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--border); border-radius: 24px; overflow: hidden; background: var(--bg-2); }
.band > .ph { border-radius: 0; min-height: 300px; }
.band .band-body { padding: clamp(24px, 4vw, 44px); display: flex; flex-direction: column; justify-content: center; }
@media (max-width: 760px) { .band { grid-template-columns: 1fr; } .band > .ph { min-height: 200px; } }
.band.pink-edge { border-color: rgba(255,191,214,.3); }
.your { border: 1px solid rgba(47,212,180,.45); box-shadow: var(--glow); }
.policies { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.policies div { padding: 18px; border-radius: var(--radius); background: var(--bg-2); border: 1px solid var(--border); font-size: 14px; color: #c3cbea; }
.policies b { display: block; font: 800 26px/1 var(--display); color: var(--text); margin-bottom: 6px; text-transform: uppercase; }

/* Booking pickers and sheets */
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.day { flex: 0 0 auto; width: 66px; text-align: center; padding: 10px 4px; border-radius: 14px; border: 1px solid var(--border-2); background: var(--surface); cursor: pointer; display: block; min-height: 0; }
.day .dow { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.day .dn { font: 800 24px/1.1 var(--display); }
.day .cnt { font-size: 11px; color: var(--muted); }
.day.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day.on .dow, .day.on .cnt { color: var(--accent-ink); }
.day:disabled { opacity: .35; }
.slots { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); margin-top: 14px; }
.slot { border-radius: 12px; }
.slot.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sheet-bg { position: fixed; inset: 0; background: rgba(2,4,12,.7); backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .sheet-bg { align-items: center; } }
.sheet { background: var(--bg-2); border: 1px solid var(--border-2); width: 100%; max-width: 540px; max-height: 92vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); box-shadow: 0 -20px 60px rgba(0,0,0,.5); }
@media (min-width: 640px) { .sheet { border-radius: 24px; } }
.sheet .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sheet .head h2 { margin: 0; font-size: 28px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 99px; z-index: 60; font-weight: 700; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.5); }

/* Dashboard */
.dash { display: grid; grid-template-columns: 220px 1fr; gap: 32px; align-items: start; margin-top: 24px; }
.dash > #view { min-width: 0; }
.tabs { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); }
.tabs button { justify-content: flex-start; border: 1px solid transparent; border-radius: 12px; background: none; color: var(--muted); padding: 10px 14px; white-space: nowrap; font-weight: 700; }
.tabs button:hover { color: var(--text); background: var(--surface); border-color: transparent; }
.tabs button.on { color: var(--text); background: var(--surface-2); border-color: var(--border-2); box-shadow: inset 3px 0 0 var(--accent); }
@media (max-width: 860px) {
  .dash { grid-template-columns: 1fr; gap: 12px; }
  .tabs { flex-direction: row; overflow-x: auto; position: static; border-bottom: 1px solid var(--border); scrollbar-width: none; padding-bottom: 8px; }
  .tabs button.on { box-shadow: inset 0 -2px 0 var(--accent); }
}
.stats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.stat .n { font: 800 40px/1.05 var(--display); letter-spacing: .01em; font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
.stat .l { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.stat:first-child { border-color: rgba(47,212,180,.5); box-shadow: var(--glow); }
.stat:first-child .n { color: var(--accent-text); }
.avail-day { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); align-items: start; }
.avail-day:first-child { border-top: 0; }
.win { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.win input { width: auto; flex: 1; min-width: 0; padding: 7px 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ===== Onyx Lab: onyx black, electric indigo, tropical mint (mint uses the --pink slot) ===== */
:root {
  --bg: #0a0a0c; --bg-2: #101013; --surface: #141418; --surface-2: #1c1c22; --border: #24242c; --border-2: #32323d;
  --text: #f4f4f6; --muted: #9a9aa8; --faint: #62626f; --text-2: #c9c9d3;
  --accent: #5b3df5; --accent-ink: #ffffff; --accent-text: #9583ff; --accent-soft: rgba(91,61,245,.16);
  --pink: #3ee6b0; --pink-soft: rgba(62,230,176,.12); --ph-line: #f4f4f6;
  --radius: 8px; --radius-sm: 6px;
  --glow: 0 0 0 1px var(--accent), 0 16px 40px -16px rgba(91,61,245,.7);
  --display: "Chakra Petch", "IBM Plex Sans", sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
body { background: var(--bg); }
h1, h2 { font-weight: 700; letter-spacing: 0; }
h2 { font-size: clamp(26px, 3.4vw, 36px); }
button, .btn { border-radius: 6px; }
button.primary, .btn.primary { box-shadow: 0 10px 30px -12px rgba(91,61,245,.9); }
.card { background: var(--surface); }
.price { font: 700 36px/1 var(--display); }
.pkg .per b { color: var(--pink); font-family: var(--mono); }
.eyebrow { font-family: var(--mono); font-weight: 500; letter-spacing: .08em; color: var(--pink); }
.eyebrow::before { content: "//"; width: auto; height: auto; background: none; color: var(--faint); }
.ph { background: radial-gradient(80% 70% at 85% 15%, rgba(62,230,176,.35), transparent 60%), radial-gradient(90% 90% at 10% 100%, rgba(91,61,245,.55), transparent 60%), linear-gradient(160deg, #1a1a24, #0d0d12); }
.band, .ph { border-radius: 8px; }
.step::before { -webkit-text-stroke: 0; color: var(--accent-text); font-family: var(--mono); font-size: 14px; font-weight: 500; content: "STEP_0" counter(step); }
.step { background: var(--surface); }
.policies b { font-family: var(--display); }
.mark { background: linear-gradient(135deg, var(--accent), var(--pink)); border-radius: 6px; box-shadow: none; }
.brand { font: 700 18px/1 var(--display); letter-spacing: .04em; }
.stat .n, .hero-meta b { font-family: var(--display); }
/* hero */
.lab { position: relative; margin-top: 20px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  background: radial-gradient(50% 60% at 80% 20%, rgba(91,61,245,.28), transparent 60%), radial-gradient(40% 40% at 0% 100%, rgba(62,230,176,.12), transparent 60%),
  linear-gradient(var(--border) 1px, transparent 1px) 0 0/40px 40px, linear-gradient(90deg, var(--border) 1px, transparent 1px) 0 0/40px 40px, var(--bg); }
.lab-inner { display: grid; grid-template-columns: 1.2fr .8fr; gap: 32px; padding: clamp(28px, 5vw, 60px); align-items: center; background: linear-gradient(90deg, rgba(10,10,12,.92) 40%, rgba(10,10,12,.55)); }
@media (max-width: 880px) { .lab-inner { grid-template-columns: 1fr; } }
.lab .tagline { font: 500 12px var(--mono); color: var(--muted); letter-spacing: .06em; margin-bottom: 18px; }
.lab .tagline b { color: var(--pink); font-weight: 500; }
.lab h1 { font: 700 clamp(54px, 8.6vw, 116px)/.92 var(--display); text-transform: uppercase; margin: 0 0 22px; letter-spacing: -.01em; }
.lab h1 em { font-style: normal; background: linear-gradient(90deg, #7a5cff, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lab .lede { color: var(--text-2); }
.board { background: rgba(16,16,19,.92); border: 1px solid var(--border-2); border-radius: 10px; overflow: hidden; font-family: var(--mono); box-shadow: 0 30px 60px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(91,61,245,.15); }
.board .bh { display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 11px; letter-spacing: .1em; color: var(--muted); }
.board .live { color: var(--pink); display: inline-flex; gap: 6px; align-items: center; }
.board .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 10px var(--pink); }
.board .mini-slots { display: block; margin: 0; }
.board .mini-slots span { display: flex; justify-content: space-between; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; background: none; padding: 12px 16px; font: 500 14px var(--mono); text-align: left; }
.board .mini-slots span::after { content: "OPEN"; color: var(--pink); font-size: 11px; letter-spacing: .1em; }
.board .mini-slots span:first-child { background: var(--accent-soft); color: var(--text); }
.board .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--border); }
.board .stats3 div { padding: 12px 16px; font-size: 10px; letter-spacing: .1em; color: var(--muted); border-right: 1px solid var(--border); }
.board .stats3 div:last-child { border-right: 0; }
.board .stats3 b { display: block; font: 700 20px/1.2 var(--display); color: var(--text); letter-spacing: 0; }
.board .bf { padding: 14px 16px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ======================================================================
// Small helpers
// ======================================================================
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/** Placeholder image: gradient panel with a figure outline and a label. Swap for a real <img> later. */
function ph(label) {
  return `<div class="ph" role="img" aria-label="${esc(label)} (placeholder)">
    <svg class="fig" viewBox="0 0 200 260" aria-hidden="true"><g fill="none" style="stroke:var(--ph-line)" stroke-width="2">
      <circle cx="100" cy="70" r="34"/><path d="M30 260 C 30 170, 60 128, 100 128 S 170 170, 170 260"/></g></svg>
    <span class="ph-label">${esc(label)}</span></div>`;
}
const money = (c) => "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2 });
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

async function api(method, path, body, token) {
  const res = await fetch("/api" + path, {
    method, headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) { const e = new Error(data.error || "Something went wrong."); e.status = res.status; throw e; }
  return data;
}

let toastTimer;
function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}

function sheet(title, html, onMount) {
  const bg = document.createElement("div");
  bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="head"><h2>${esc(title)}</h2><button class="ghost sm" data-close aria-label="Close">✕</button></div>
    <div class="body">${html}</div></div>`;
  const close = () => { bg.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  bg.addEventListener("click", (e) => { if (e.target === bg || e.target.closest("[data-close]")) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(bg);
  onMount && onMount($(".body", bg), close);
  const first = bg.querySelector("input, select, textarea");
  first && first.focus();
  return close;
}

function confirmSheet(title, text, yesLabel, danger) {
  return new Promise((resolve) => {
    let answered = false;
    const close = sheet(title, `<p>${text}</p><div class="row" style="justify-content:flex-end;margin-top:16px">
      <button data-no>Never mind</button><button class="${danger ? "primary" : "primary"}" data-yes>${esc(yesLabel)}</button></div>`,
      (body, close) => {
        $("[data-no]", body).onclick = () => { answered = true; close(); resolve(false); };
        $("[data-yes]", body).onclick = () => { answered = true; close(); resolve(true); };
      });
  });
}

/** Wires a <form> to an async handler with busy state and inline errors. */
function handleForm(form, fn) {
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = form.querySelector("button[type=submit]");
    const err = form.querySelector(".err");
    if (err) err.textContent = "";
    btn && (btn.disabled = true);
    try { await fn(Object.fromEntries(new FormData(form))); }
    catch (x) { if (err) err.textContent = x.message; else toast(x.message); }
    finally { btn && (btn.disabled = false); }
  });
}

// ---------- Time zone helpers (everything is shown in the coach's time zone) ----------
function fmtIn(tz, opts) { return new Intl.DateTimeFormat("en-US", { timeZone: tz, ...opts }); }
const fmtDay = (d, tz) => fmtIn(tz, { weekday: "short", month: "short", day: "numeric" }).format(new Date(d));
const fmtTime = (d, tz) => fmtIn(tz, { hour: "numeric", minute: "2-digit" }).format(new Date(d));
const fmtWhen = (d, tz) => `${fmtDay(d, tz)} · ${fmtTime(d, tz)}`;
const fmtDate = (d, tz) => fmtIn(tz, { month: "short", day: "numeric", year: "numeric" }).format(new Date(d));
function tzLabel(tz) {
  try { return fmtIn(tz, { timeZoneName: "short" }).formatToParts(new Date()).find((p) => p.type === "timeZoneName").value; } catch { return tz; }
}
function localParts(ms, tz) {
  const p = {};
  for (const x of fmtIn(tz, { hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }).formatToParts(new Date(ms))) p[x.type] = x.value;
  return p;
}
function localDate(ms, tz) { const p = localParts(ms, tz); return `${p.year}-${p.month}-${p.day}`; }
function offsetMs(ms, tz) { const p = localParts(ms, tz); return Date.UTC(+p.year, p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000; }
/** "YYYY-MM-DDTHH:MM" as wall time in tz -> UTC ms. */
function zonedToUtc(local, tz) {
  const [d, t = "00:00"] = local.split("T");
  const [y, m, day] = d.split("-").map(Number); const [hh, mm] = t.split(":").map(Number);
  const wall = Date.UTC(y, m - 1, day, hh, mm);
  let utc = wall - offsetMs(wall, tz);
  const second = wall - offsetMs(utc, tz);
  return second !== utc ? second : utc;
}
function toLocalInput(ms, tz) { const p = localParts(ms, tz); return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`; }
function addDays(date, n) { const [y, m, d] = date.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
const minToTime = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const timeToMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

const STATUS = {
  booked: ["Booked", "accent"], completed: ["Done", "ok"], no_show: ["No-show", "warn"],
  late_cancel: ["Late cancel", "warn"], canceled: ["Canceled", ""],
};
const statusPill = (s) => `<span class="pill ${STATUS[s][1]}">${STATUS[s][0]}</span>`;

// ======================================================================
// Slot picker (shared by clients booking/rescheduling)
// ======================================================================
/**
 * Renders a day strip + time slots into `el`. Calls onPick(isoString) when a time is chosen.
 * fetchSlots(fromDate, days) -> { slots: [iso], timezone }
 */
async function slotPicker(el, tz, maxDays, fetchSlots, onPick) {
  const today = localDate(Date.now(), tz);
  const total = Math.min(maxDays, 42);
  let byDay = {}; let selected = null; let loaded = 0;
  el.innerHTML = `<div class="days" role="listbox" aria-label="Pick a day"></div><div class="slots"></div>
    <p class="muted small" style="margin-top:12px">Times are ${esc(tzLabel(tz))}.</p>`;
  const daysEl = $(".days", el), slotsEl = $(".slots", el);

  async function load(from) {
    const r = await fetchSlots(from, 14);
    for (let i = 0; i < 14; i++) byDay[addDays(from, i)] ||= [];
    for (const s of r.slots) (byDay[localDate(Date.parse(s), tz)] ||= []).push(s);
    loaded += 14;
  }
  function drawDays() {
    const dates = Object.keys(byDay).sort().slice(0, total);
    daysEl.innerHTML = dates.map((d) => {
      const ms = Date.parse(d + "T12:00:00Z"); const n = byDay[d].length;
      return `<button class="day ${d === selected ? "on" : ""}" data-d="${d}" ${n ? "" : "disabled"} aria-selected="${d === selected}">
        <div class="dow">${DOW[new Date(ms).getUTCDay()]}</div><div class="dn">${+d.slice(8)}</div><div class="cnt">${n ? n + " open" : "—"}</div></button>`;
    }).join("") + (loaded < total ? `<button class="day" data-more><div class="dow">More</div><div class="dn">→</div><div class="cnt">days</div></button>` : "");
  }
  function drawSlots() {
    const list = byDay[selected] || [];
    slotsEl.innerHTML = list.length ? list.map((s) => `<button class="slot" data-s="${s}">${fmtTime(s, tz)}</button>`).join("")
      : `<p class="muted" style="grid-column:1/-1">No open times this day.</p>`;
  }
  daysEl.addEventListener("click", async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.more !== undefined) {
      b.disabled = true; await load(addDays(today, loaded)); drawDays(); return;
    }
    selected = b.dataset.d; drawDays(); drawSlots();
  });
  slotsEl.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-s]"); if (!b) return;
    slotsEl.querySelectorAll(".slot").forEach((x) => x.classList.toggle("on", x === b));
    onPick(b.dataset.s);
  });
  slotsEl.innerHTML = `<p class="muted">Loading times…</p>`;
  await load(today);
  if (!Object.values(byDay).some((l) => l.length) && loaded < total) await load(addDays(today, loaded));
  selected = Object.keys(byDay).sort().find((d) => byDay[d].length) || today;
  drawDays(); drawSlots();
}

// ======================================================================
// Router
// ======================================================================
const app = $("#app");
function route() {
  const path = location.pathname.replace(/\/+$/, "") || "/";
  if (path === "/") return directoryPage();
  if (path === "/admin") return coachApp();
  const slug = path.slice(1).split("/")[0].toLowerCase();
  return coachPage(slug);
}

async function directoryPage() {
  app.innerHTML = `<div class="wrap"><p class="muted" style="margin-top:40px">Loading…</p></div>`;
  try {
    const { coaches } = await api("GET", "/directory");
    if (coaches.length === 1) { history.replaceState(null, "", "/" + coaches[0].slug); return route(); }
    app.innerHTML = `<header class="top"><div class="wrap"><span class="brand">Coach Booking</span><a class="btn" href="/admin">Coach sign in</a></div></header>
      <main class="wrap section">
        <h1>Book lessons with your coach</h1>
        <p class="muted">Buy a package, then book and reschedule lessons online.</p>
        ${coaches.length ? `<div class="grid" style="margin-top:20px">${coaches.map((c) => `
          <a class="card" href="/${esc(c.slug)}" style="text-decoration:none;color:inherit">
            <h3>${esc(c.name)}</h3><p class="muted">${esc(c.headline || c.location || "")}</p></a>`).join("")}</div>`
          : `<div class="card" style="margin-top:20px"><h3>No coaches yet</h3><p class="muted">If you're the owner, <a href="/admin">create your coach account</a>.</p></div>`}
      </main>`;
  } catch (e) {
    app.innerHTML = `<div class="wrap"><div class="banner" style="margin-top:40px">${esc(e.message)}</div></div>`;
  }
}

// ======================================================================
// Public coach page + client area
// ======================================================================
async function coachPage(slug) {
  const tokenKey = "client:" + slug;
  let token = store.get(tokenKey);
  let pub, me = null;

  app.innerHTML = `<div class="wrap"><p class="muted" style="margin-top:40px">Loading…</p></div>`;
  const offerToken = new URLSearchParams(location.search).get("offer") || store.get("offer:" + slug) || "";
  try { pub = await api("GET", `/c/${slug}${offerToken ? "?offer=" + encodeURIComponent(offerToken) : ""}`); }
  catch (e) {
    app.innerHTML = `<div class="wrap auth"><div class="card"><h2>Page not found</h2><p class="muted">There's no coach at this address.</p><a href="/">Go home</a></div></div>`;
    return;
  }
  const coach = pub.coach, tz = coach.timezone;
  document.title = `${coach.name} · Lessons`;
  // Remember an offer link across sign-up and the Stripe round trip; forget it once it's gone.
  store.set("offer:" + slug, pub.offer ? offerToken : null);
  const allPkgs = [...pub.packages, ...(pub.offer ? [pub.offer] : [])];
  const groupLabel = (n) => `Group of ${n}`;

  async function loadMe() {
    if (!token) { me = null; return; }
    try { me = await api("GET", `/c/${slug}/me`, null, token); }
    catch (e) { if (e.status === 401) { token = null; store.set(tokenKey, null); me = null; } else throw e; }
  }

  // Back from Stripe Checkout.
  const params = new URLSearchParams(location.search);
  let notice = "", justPaid = false;
  if (params.get("paid") && token) {
    try {
      const r = await api("POST", `/c/${slug}/purchases/${encodeURIComponent(params.get("paid"))}/confirm`, {}, token);
      justPaid = r.paid;
      notice = r.paid ? `<div class="banner ok">Payment received. Your lessons are ready to book.</div>`
        : `<div class="banner">We haven't seen the payment go through yet. Refresh in a minute.</div>`;
    } catch {}
    history.replaceState(null, "", location.pathname);
  } else if (params.get("canceled")) {
    notice = `<div class="banner info">Checkout canceled. You weren't charged.</div>`;
    history.replaceState(null, "", location.pathname);
  }

  await loadMe();
  draw();
  if (justPaid && me?.creditsRemaining) bookSheet();

  function pkgCard(p, opts = {}) {
    const per = p.kind === "group" ? null : Math.round(p.priceCents / p.lessonCount);
    return `<div class="card pkg ${opts.best ? "best" : ""}" ${opts.offer ? 'style="border-color:rgba(255,191,214,.5)"' : ""}>
      ${opts.best ? `<span class="pill accent tag">Best value</span>` : ""}
      ${opts.offer ? `<span class="pill pink" style="align-self:flex-start">Custom offer for you</span>` : ""}
      <h3 style="margin:0">${esc(p.name)}</h3>
      ${p.kind === "group"
        ? `<div class="price">${money(p.priceCents)} <small>per person</small></div>
           <div class="per">${p.minPeople}–${p.maxPeople} people · ${p.lessonCount} lesson${p.lessonCount > 1 ? "s" : ""}</div>`
        : `<div class="price">${money(p.priceCents)}</div>
           <div class="per">${p.lessonCount} lesson${p.lessonCount > 1 ? "s" : ""}${p.lessonCount > 1 ? ` · <b>${money(per)}</b> each` : ""}</div>`}
      <p class="desc" style="white-space:pre-line;margin:6px 0 0">${esc(p.description)}</p>
      <p class="muted small" style="margin:0">Use within ${p.expiresDays} days</p>
      <button class="${opts.best || opts.offer ? "primary" : ""} block" style="margin-top:8px" data-act="buy" data-id="${p.id}" ${pub.paymentsReady ? "" : "disabled"}>${p.kind === "group" ? "Choose group size" : "Buy package"}</button>
    </div>`;
  }

  /** Big hero headline: words split over up to three lines, last word boxed like a selected layer. */
  function displayHeadline(text) {
    const words = String(text || coach.name).trim().toUpperCase().split(/\s+/).filter(Boolean);
    const last = words.pop() || "";
    const lines = [];
    for (const w of words) {
      const cur = lines[lines.length - 1];
      if (cur && (cur + " " + w).length <= 11 && lines.length) lines[lines.length - 1] = cur + " " + w;
      else lines.push(w);
    }
    return lines.map((l) => `<span class="line">${esc(l)}</span>`).join("") + `<span class="line"><span class="sel">${esc(last)}</span></span>`;
  }

  function draw() {
    const upcoming = me ? me.lessons.filter((l) => l.status === "booked").sort((a, b) => a.startsAt.localeCompare(b.startsAt)) : [];
    const past = me ? me.lessons.filter((l) => l.status !== "booked").slice(0, 10) : [];
    const privatePkgs = pub.packages.filter((p) => p.kind !== "group");
    const groupPkgs = pub.packages.filter((p) => p.kind === "group");
    const perLesson = (p) => p.priceCents / p.lessonCount;
    const multi = privatePkgs.filter((p) => p.lessonCount > 1);
    const best = multi.length ? multi.reduce((a, b) => (perLesson(b) < perLesson(a) ? b : a)) : null;
    const fromPrice = privatePkgs.length ? Math.min(...privatePkgs.map(perLesson)) : null;
    const group = groupPkgs[0];
    const lede = `Private lessons, small groups and team wellness${coach.location ? ` in ${esc(coach.location)}` : ""}. Buy a package, book online and reschedule anytime.`;

    app.innerHTML = `
      <header class="top"><div class="wrap">
        <a class="brand" href="/${esc(slug)}"><span class="mark" aria-hidden="true"></span>${esc(coach.name)}</a>
        <nav class="nav-links" aria-label="Sections">
          <a data-act="go" data-to="packages">Lessons</a>
          ${groupPkgs.length ? `<a data-act="go" data-to="groups">Groups</a>` : ""}
          <a data-act="go" data-to="corporate">Corporate</a>
          ${coach.bio ? `<a data-act="go" data-to="about">About</a>` : ""}
        </nav>
        <div class="row" style="flex-wrap:nowrap;gap:8px">
          ${me ? `<span class="muted small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px">${esc(me.client.name)}</span><button class="sm" data-act="logout">Sign out</button>`
               : `<button class="sm ghost" data-act="login">Sign in</button><button class="sm primary" data-act="go" data-to="packages">Get started</button>`}
        </div>
      </div></header>

      <main class="wrap">
        <section class="lab"><div class="lab-inner">
          <div>
            ${notice}
            <div class="tagline"><b>&gt;</b> ${esc(coach.name.toUpperCase())} <span style="color:var(--faint)">/ private · groups · corporate</span></div>
            <h1>${esc((coach.headline || "").split(" ").slice(0, -1).join(" "))}<br><em>${esc((coach.headline || "").split(" ").slice(-1)[0] || "")}</em></h1>
            <p class="lede">${lede}</p>
            <div class="hero-cta">
              <button class="primary lg" data-act="go" data-to="packages">See packages</button>
              <button class="lg" data-act="go" data-to="groups">Small groups</button>
            </div>
          </div>
          <div class="board">
            <div class="bh"><span>NEXT_OPEN // ${esc(tzLabel(tz))}</span><span class="live">LIVE</span></div>
            <div class="mini-slots" id="next-slots"><span>…</span><span>…</span><span>…</span><span>…</span></div>
            <div class="stats3">
              ${fromPrice ? `<div><b>${money(Math.round(fromPrice))}</b>PER LESSON</div>` : ""}
              <div><b>${coach.lessonMinutes}m</b>LENGTH</div>
              ${group ? `<div><b>${group.minPeople}–${group.maxPeople}</b>GROUP</div>` : ""}
            </div>
            <div class="bf"><button class="primary block" data-act="${me && me.creditsRemaining ? "book" : "go"}" data-to="packages">Book a lesson</button></div>
          </div>
        </div></section>

        ${me ? `
        <section class="section" style="margin-top:28px">
          <div class="card your">
            <div class="row spread" style="align-items:flex-start">
              <div class="grow">
                <div class="eyebrow">Your lessons</div>
                ${me.credits.length ? me.credits.map((c) => `<p style="margin:2px 0">
                    <strong style="font:800 22px var(--display)">${c.remaining}</strong> ${c.kind === "group" ? `group lesson${c.remaining === 1 ? "" : "s"} (${c.partySize} people)` : `lesson${c.remaining === 1 ? "" : "s"}`} left
                    <span class="muted small">· ${esc(c.packageName)}${c.expiresAt ? ` · use by ${fmtDate(c.expiresAt, tz)}` : ""}</span></p>`).join("")
                  : `<p class="muted" style="margin:0">No lessons left to book.</p>`}
              </div>
              ${me.creditsRemaining ? `<button class="primary" data-act="book">Book a lesson</button>` : `<button class="primary" data-act="go" data-to="packages">Buy lessons</button>`}
            </div>
            <div class="list" style="margin-top:16px">
              ${upcoming.length ? upcoming.map((l) => `
                <div class="item">
                  <div class="grow"><div class="when">${fmtWhen(l.startsAt, tz)}</div><div class="muted small">${l.kind === "group" ? groupLabel(l.partySize) + " · " : ""}${coach.lessonMinutes} min${l.note ? " · " + esc(l.note) : ""}</div></div>
                  ${(Date.parse(l.startsAt) - Date.now()) / 3600e3 >= coach.cancelWindowHours ? `
                  <button class="sm" data-act="move" data-id="${l.id}">Reschedule</button>
                  <button class="sm danger" data-act="cancel" data-id="${l.id}">Cancel</button>`
                  : `<span class="muted small">Less than ${coach.cancelWindowHours}h away. Contact ${esc(coach.name)} to change.</span>`}
                </div>`).join("") : `<div class="empty">No upcoming lessons.</div>`}
            </div>
            ${past.length ? `<details style="margin-top:12px"><summary class="muted small">Past lessons</summary>
              <div class="list" style="margin-top:8px">${past.map((l) => `<div class="item"><div class="grow">${fmtWhen(l.startsAt, tz)}</div>${statusPill(l.status)}</div>`).join("")}</div></details>` : ""}
          </div>
        </section>` : ""}

        ${pub.offer ? `<section class="section"><div class="grid">${pkgCard(pub.offer, { offer: true })}</div></section>` : ""}

        <section class="section">
          <div class="eyebrow">How it works</div>
          <h2>Three steps to your first lesson</h2>
          <div class="steps" style="margin-top:20px">
            <div class="step"><h3>Pick a package</h3><p class="muted" style="margin:0">Single lessons, multi-lesson packs that bring the price down, or a small group with friends.</p></div>
            <div class="step"><h3>Book your time</h3><p class="muted" style="margin:0">Choose from open times on the calendar. Reschedule online up to ${coach.cancelWindowHours} hours ahead.</p></div>
            <div class="step"><h3>Show up and train</h3><p class="muted" style="margin:0">Your remaining lessons and upcoming bookings are always in your account.</p></div>
          </div>
        </section>

        <section class="section" id="packages">
          <div class="eyebrow">Private lessons</div>
          <div class="row spread" style="align-items:flex-end;margin-bottom:20px">
            <h2 style="margin:0">Packages</h2>
            <p class="muted small" style="margin:0">${pub.paymentsReady ? "Secure card payment through Stripe" : "Online payment isn't turned on yet"}</p>
          </div>
          ${privatePkgs.length ? `<div class="grid">${privatePkgs.map((p) => pkgCard(p, { best: best && p.id === best.id })).join("")}</div>` : `<p class="muted">Packages coming soon.</p>`}
        </section>

        ${groupPkgs.length ? `
        <section class="section" id="groups">
          <div class="band">
            ${ph("Group session photo")}
            <div class="band-body">
              <div class="eyebrow">Small groups</div>
              <h2>Bring your crew</h2>
              <p class="muted">Friends, siblings or teammates train together. One person books and pays for the whole group.</p>
              <div class="stack">${groupPkgs.map((p) => `
                <div class="row spread" style="padding:16px;border:1px solid var(--border-2);border-radius:14px;background:var(--surface)">
                  <div><div class="price" style="font-size:32px">${money(p.priceCents)} <small>per person</small></div>
                  <div class="muted small">${esc(p.name)} · ${p.minPeople}–${p.maxPeople} people</div></div>
                  <button class="primary" data-act="buy" data-id="${p.id}" ${pub.paymentsReady ? "" : "disabled"}>Choose group size</button>
                </div>`).join("")}</div>
            </div>
          </div>
        </section>` : ""}

        <section class="section" id="corporate">
          <div class="band pink-edge">
            <div class="band-body">
              <div class="eyebrow">Corporate wellness</div>
              <h2>Sessions for your team</h2>
              <p class="muted">On-site or group sessions built around your team's schedule and goals. Every program is quoted to fit, so tell us what you have in mind.</p>
              <div><button class="primary" data-act="quote">Request a quote</button></div>
            </div>
            ${ph("Team session photo")}
          </div>
        </section>

        ${coach.bio ? `
        <section class="section" id="about">
          <div class="band">
            ${ph("Portrait")}
            <div class="band-body">
              <div class="eyebrow">About</div>
              <h2>${esc(coach.name)}</h2>
              <p style="white-space:pre-line;color:var(--text-2);margin:0">${esc(coach.bio)}</p>
            </div>
          </div>
        </section>` : ""}

        <section class="section">
          <div class="eyebrow">Policies</div>
          <div class="policies" style="margin-top:8px">
            <div><b>${coach.cancelWindowHours} hours</b>Reschedule or cancel online up to ${coach.cancelWindowHours} hours before a lesson and it goes back on your balance.</div>
            <div><b>Late or no-show</b>Inside ${coach.cancelWindowHours} hours, or if you don't show up, the lesson counts as used.</div>
            <div><b>${coach.maxDaysAhead} days out</b>Book at least ${coach.minNoticeHours} hour${coach.minNoticeHours === 1 ? "" : "s"} ahead and up to ${coach.maxDaysAhead} days out.</div>
          </div>
        </section>
      </main>
      <footer><div class="wrap row spread">
        <span class="brand" style="font-size:16px"><span class="mark" aria-hidden="true"></span>${esc(coach.name)}</span>
        <span>© ${new Date().getFullYear()} · <a href="/admin">Coach sign in</a></span>
      </div></footer>`;
    fillNextSlots();
  }

  async function fillNextSlots() {
    const el = $("#next-slots"); if (!el) return;
    try {
      const r = await api("GET", `/c/${slug}/slots?from=${localDate(Date.now(), tz)}&days=14`);
      const s = r.slots.slice(0, 4);
      el.innerHTML = s.length ? s.map((x) => `<span>${fmtIn(tz, { weekday: "short" }).format(new Date(x))} ${fmtTime(x, tz)}</span>`).join("")
        : `<span style="grid-column:1/-1">No open times yet</span>`;
    } catch { el.innerHTML = ""; }
  }

  app.onclick = async (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id;
    if (act === "login") return authSheet();
    if (act === "logout") {
      api("POST", `/c/${slug}/logout`, {}, token).catch(() => {});
      token = null; store.set(tokenKey, null); me = null; draw(); return;
    }
    if (act === "buy") {
      const pkg = allPkgs.find((p) => p.id == id);
      const go = () => (pkg.kind === "group" ? groupSheet(pkg) : buy(pkg));
      if (!me) return authSheet(go);
      return go();
    }
    if (act === "quote") return quoteSheet();
    if (act === "go") { document.getElementById(b.dataset.to)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (act === "book") return bookSheet();
    if (act === "move") return bookSheet(me.lessons.find((l) => l.id == id));
    if (act === "cancel") {
      const l = me.lessons.find((x) => x.id == id);
      if (!(await confirmSheet("Cancel lesson?", `${esc(fmtWhen(l.startsAt, tz))}. The lesson goes back on your balance.`, "Cancel lesson"))) return;
      try { await api("POST", `/c/${slug}/lessons/${id}/cancel`, {}, token); toast("Lesson canceled"); await loadMe(); draw(); }
      catch (x) { toast(x.message); }
    }
  };

  async function buy(pkg, people) {
    try {
      const r = await api("POST", `/c/${slug}/checkout`, { packageId: pkg.id, people, offer: pkg.isOffer ? offerToken : undefined }, token);
      location.href = r.url;
    } catch (x) { toast(x.message); }
  }

  function groupSheet(pkg) {
    const opts = [];
    for (let n = pkg.minPeople; n <= pkg.maxPeople; n++) opts.push(n);
    sheet(pkg.name, `
      <p class="muted">${money(pkg.priceCents)} per person · ${pkg.lessonCount} lesson${pkg.lessonCount > 1 ? "s" : ""}. Count everyone in the group, including you.</p>
      <label>How many people?</label>
      <div class="slots" style="margin-top:4px">${opts.map((n) => `<button class="slot" data-n="${n}">${n}</button>`).join("")}</div>
      <button class="primary block" data-go disabled style="margin-top:16px">Pick a group size</button>`,
      (body) => {
        const go = $("[data-go]", body); let people = 0;
        body.addEventListener("click", (e) => {
          const b = e.target.closest("[data-n]"); if (!b) return;
          people = +b.dataset.n;
          body.querySelectorAll("[data-n]").forEach((x) => x.classList.toggle("on", x === b));
          go.disabled = false; go.textContent = `Pay ${money(pkg.priceCents * people)} for ${people} people`;
        });
        go.onclick = () => { go.disabled = true; buy(pkg, people); };
      });
  }

  function quoteSheet() {
    sheet("Corporate wellness", `<form>
      <p class="muted">Tell ${esc(coach.name)} about your team and they'll follow up with a custom quote.</p>
      <div class="fields">
        <div class="field"><label for="q-name">Your name</label><input id="q-name" name="name" required autocomplete="name"></div>
        <div class="field"><label for="q-company">Company</label><input id="q-company" name="company" autocomplete="organization"></div>
        <div class="field"><label for="q-email">Work email</label><input id="q-email" name="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="q-phone">Phone</label><input id="q-phone" name="phone" type="tel" autocomplete="tel"></div>
      </div>
      <div class="field"><label for="q-size">About how many people?</label><input id="q-size" name="groupSize" placeholder="e.g. 15"></div>
      <div class="field"><label for="q-msg">What are you looking for?</label><textarea id="q-msg" name="message" placeholder="How often, where, any goals or dates"></textarea></div>
      <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">
      <button class="primary block" type="submit">Send request</button><p class="err"></p></form>`, (body, close) => {
      handleForm($("form", body), async (f) => {
        await api("POST", `/c/${slug}/inquiries`, f);
        close(); toast("Request sent. We'll be in touch.");
      });
    });
  }

  function authSheet(after) {
    let mode = "signup";
    sheet("Your account", `<div data-auth></div>`, (body, close) => {
      const el = $("[data-auth]", body);
      const render = () => {
        el.innerHTML = `
          <p class="muted">${mode === "signup" ? `Create an account to buy and book lessons with ${esc(coach.name)}.` : "Welcome back."}</p>
          <form>
            ${mode === "signup" ? `<div class="field"><label for="a-name">Name</label><input id="a-name" name="name" autocomplete="name" required></div>
              <div class="field"><label for="a-phone">Phone</label><input id="a-phone" name="phone" type="tel" autocomplete="tel"></div>` : ""}
            <div class="field"><label for="a-email">Email</label><input id="a-email" name="email" type="email" autocomplete="email" required></div>
            <div class="field"><label for="a-pw">Password</label><input id="a-pw" name="password" type="password" autocomplete="${mode === "signup" ? "new-password" : "current-password"}" minlength="8" required></div>
            <button class="primary block" type="submit">${mode === "signup" ? "Create account" : "Sign in"}</button>
            <p class="err"></p>
          </form>
          <p class="small muted" style="text-align:center">${mode === "signup" ? `Have an account? <a href="#" data-sw>Sign in</a>` : `New here? <a href="#" data-sw>Create an account</a>`}</p>
          ${mode === "login" ? `<p class="small muted" style="text-align:center">Forgot your password? Ask ${esc(coach.name)} to reset it.</p>` : ""}`;
        $("[data-sw]", el).onclick = (e) => { e.preventDefault(); mode = mode === "signup" ? "login" : "signup"; render(); };
        handleForm($("form", el), async (d) => {
          const r = await api("POST", `/c/${slug}/${mode}`, d);
          token = r.token; store.set(tokenKey, token);
          await loadMe(); close(); draw();
          after && after();
        });
      };
      render();
    });
  }

  function bookSheet(moving) {
    let pick = null;
    // One choice per kind of lesson the client can book (private, or a group of N).
    const choices = [];
    if (!moving) for (const c of me.credits) {
      const key = c.kind === "group" ? "g" + c.partySize : "p";
      if (!choices.some((x) => x.key === key)) choices.push({ key, credit: c, label: c.kind === "group" ? groupLabel(c.partySize) : "Private lesson" });
    }
    let chosen = choices[0];
    sheet(moving ? "Reschedule lesson" : "Book a lesson", `
      ${moving ? `<p class="muted">Currently ${esc(fmtWhen(moving.startsAt, tz))}</p>` : ""}
      ${choices.length > 1 ? `<label>Which lesson?</label><div class="row" style="margin-bottom:14px">${choices.map((c, i) =>
        `<button class="slot ${i === 0 ? "on" : ""}" data-kind="${c.key}">${esc(c.label)}</button>`).join("")}</div>` : ""}
      <div data-picker></div>
      ${moving ? "" : `<div class="field" style="margin-top:14px"><label for="b-note">Anything to work on? (optional)</label><input id="b-note" maxlength="500"></div>`}
      <button class="primary block" data-go disabled style="margin-top:14px">Pick a time</button><p class="err"></p>`,
      (body, close) => {
        const go = $("[data-go]", body);
        body.addEventListener("click", (e) => {
          const k = e.target.closest("[data-kind]"); if (!k) return;
          chosen = choices.find((c) => c.key === k.dataset.kind);
          body.querySelectorAll("[data-kind]").forEach((x) => x.classList.toggle("on", x === k));
        });
        slotPicker($("[data-picker]", body), tz, coach.maxDaysAhead,
          (from, days) => api("GET", `/c/${slug}/slots?from=${from}&days=${days}${moving ? "&exclude=" + moving.id : ""}`),
          (iso) => { pick = iso; go.disabled = false; go.textContent = `${moving ? "Move to" : "Book"} ${fmtWhen(iso, tz)}`; });
        go.onclick = async () => {
          go.disabled = true; $(".err", body).textContent = "";
          try {
            if (moving) await api("POST", `/c/${slug}/lessons/${moving.id}/reschedule`, { startsAt: pick }, token);
            else await api("POST", `/c/${slug}/lessons`, { startsAt: pick, note: $("#b-note").value, purchaseId: chosen?.credit.purchaseId }, token);
            close(); toast(moving ? "Lesson moved" : "Lesson booked"); await loadMe(); draw();
          } catch (x) { $(".err", body).textContent = x.message; go.disabled = false; }
        };
      });
  }
}

// ======================================================================
// Coach dashboard
// ======================================================================
async function coachApp() {
  document.title = "Coach dashboard";
  let token = store.get("coach");
  let d = null;
  let tab = new URLSearchParams(location.search).get("tab") || store.get("coach:tab") || "schedule";
  const fromStripe = new URLSearchParams(location.search).get("stripe");
  if (location.search) history.replaceState(null, "", "/admin");

  // Runs after everything below is defined.
  async function start() {
    if (!token) return authView();
    try { await reload(); } catch (e) { if (e.status === 401) { store.set("coach", null); return authView(); } throw e; }
    if (fromStripe) {
      try {
        const r = await api("POST", "/coach/stripe/refresh", {}, token);
        toast(r.payoutsReady ? "Payouts connected" : "Stripe still needs a few details from you");
        await reload();
      } catch (x) { toast(x.message); }
    }
    draw();
  }

  async function reload() { d = await api("GET", "/coach/dashboard", null, token); }
  const tz = () => d.coach.timezone;

  function authView() {
    let mode = "login";
    const render = () => {
      app.innerHTML = `<header class="top"><div class="wrap"><span class="brand">Coach dashboard</span></div></header>
        <main class="wrap"><div class="auth card">
          <h2>${mode === "login" ? "Sign in" : "Create your coach account"}</h2>
          <form>
            ${mode === "signup" ? `
              <div class="field"><label for="c-name">Your name</label><input id="c-name" name="name" required autocomplete="name"></div>
              <div class="field"><label for="c-slug">Page address</label><div class="row" style="gap:6px;flex-wrap:nowrap"><span class="muted small">${esc(location.host)}/</span><input id="c-slug" name="slug" required pattern="(?:[a-z0-9]|-){3,40}" placeholder="your-name"></div></div>` : ""}
            <div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" required autocomplete="email"></div>
            <div class="field"><label for="c-pw">Password</label><input id="c-pw" name="password" type="password" required minlength="${mode === "signup" ? 10 : 1}" autocomplete="${mode === "signup" ? "new-password" : "current-password"}"></div>
            ${mode === "signup" ? `<div class="field"><label for="c-code">Invite code (not needed for the first account)</label><input id="c-code" name="code"></div>` : ""}
            <button class="primary block" type="submit">${mode === "login" ? "Sign in" : "Create account"}</button>
            <p class="err"></p>
          </form>
          <p class="small muted" style="text-align:center"><a href="#" data-sw>${mode === "login" ? "New coach? Create an account" : "Have an account? Sign in"}</a></p>
        </div></main>`;
      $("[data-sw]").onclick = (e) => { e.preventDefault(); mode = mode === "login" ? "signup" : "login"; render(); };
      handleForm($("form"), async (f) => {
        if (mode === "signup") {
          f.slug = f.slug.toLowerCase();
          f.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        }
        const r = await api("POST", `/coach/${mode}`, f);
        token = r.token; store.set("coach", token);
        await reload();
        if (mode === "signup") tab = "settings";
        draw();
      });
    };
    render();
  }

  const TABS = [["schedule", "Schedule"], ["clients", "Clients"], ["requests", "Requests"], ["money", "Money"], ["packages", "Packages"], ["availability", "Availability"], ["settings", "Settings"]];
  const offerUrl = (pkg) => `${location.origin}/${d.coach.slug}?offer=${encodeURIComponent(pkg.offerToken)}`;

  function draw() {
    store.set("coach:tab", tab);
    const pageUrl = `${location.origin}/${d.coach.slug}`;
    const newRequests = d.inquiries.filter((i) => i.status === "new").length;
    const setupSteps = [
      [d.packages.length > 0, "Add a lesson package", "packages"],
      [d.availability.length > 0, "Set your weekly hours", "availability"],
      [d.coach.payoutsReady || d.paymentsFake, "Connect payouts with Stripe", "money"],
    ];
    const todo = setupSteps.filter((s) => !s[0]);
    app.innerHTML = `
      <header class="top"><div class="wrap">
        <span class="brand"><span class="mark" aria-hidden="true"></span>${esc(d.coach.name)}</span>
        <div class="row" style="flex-wrap:nowrap;gap:8px"><a class="btn sm" href="/${esc(d.coach.slug)}" target="_blank" rel="noopener">My page</a><button class="sm ghost" data-act="logout">Sign out</button></div>
      </div></header>
      <main class="wrap">
        ${todo.length ? `<div class="card" style="margin-top:20px"><div class="eyebrow">Finish setting up</div>
          ${todo.map((s) => `<div class="row" style="margin-top:6px"><span>○</span><a href="#" data-tab="${s[2]}">${s[1]}</a></div>`).join("")}
          <p class="muted small" style="margin:10px 0 0">Your page: <a href="${esc(pageUrl)}" target="_blank" rel="noopener">${esc(pageUrl)}</a></p></div>` : ""}
        ${d.paymentsFake ? `<div class="banner" style="margin-top:16px">Demo mode: payments are simulated. No real money moves.</div>` : ""}
        <div class="dash">
        <nav class="tabs" role="tablist" aria-label="Dashboard">${TABS.map(([k, l]) => `<button role="tab" class="${tab === k ? "on" : ""}" aria-selected="${tab === k}" data-tab="${k}">${l}${k === "requests" && newRequests ? ` <span class="pill warn">${newRequests}</span>` : ""}</button>`).join("")}</nav>
        <div id="view"></div>
        </div>
      </main>`;
    const v = $("#view");
    ({ schedule: viewSchedule, clients: viewClients, requests: viewRequests, money: viewMoney, packages: viewPackages, availability: viewAvailability, settings: viewSettings })[tab](v);
  }

  async function refresh() { await reload(); draw(); }

  app.onclick = async (e) => {
    const t = e.target.closest("[data-tab]");
    if (t) {
      e.preventDefault(); tab = t.dataset.tab; draw(); window.scrollTo(0, 0);
      reload().then(() => { if (!document.querySelector(".sheet-bg")) draw(); }).catch(() => {});   // pick up new bookings
      return;
    }
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id;
    try {
      if (act === "logout") { api("POST", "/coach/logout", {}, token).catch(() => {}); store.set("coach", null); token = null; return authView(); }
      if (act === "close") return closeLesson(id, b.dataset.status);
      if (act === "coach-move") return moveSheet(d.lessons.find((l) => l.id == id));
      if (act === "coach-book") { await reload(); return coachBookSheet(id); }
      if (act === "client") return clientSheet(d.clients.find((c) => c.id == id));
      if (act === "add-client") return addClientSheet();
      if (act === "pkg") return packageSheet(id ? d.packages.find((p) => p.id == id) : null);
      if (act === "pkg-offer") return packageSheet(null, { offer: true });
      if (act === "refund") return refund(d.purchases.find((p) => p.id == id));
      if (act === "keep") return keepBalance(d.purchases.find((p) => p.id == id));
      if (act === "connect") { b.disabled = true; const r = await api("POST", "/coach/stripe/connect", {}, token); location.href = r.url; return; }
      if (act === "stripe-dash") { const r = await api("GET", "/coach/stripe/dashboard", null, token); window.open(r.url, "_blank", "noopener"); return; }
      if (act === "send") { b.disabled = true; const r = await api("POST", "/coach/releases/send", {}, token); toast(r.waiting ? "Connect payouts first" : `${r.sent} sent${r.failed ? `, ${r.failed} failed` : ""}`); return refresh(); }
      if (act === "del-off") { await api("DELETE", `/coach/time-off/${id}`, null, token); return refresh(); }
      if (act === "starter") { b.disabled = true; await api("POST", "/coach/starter-packages", {}, token); toast("Packages added. Edit any of them to fit."); return refresh(); }
      if (act === "inq") { await api("PUT", `/coach/inquiries/${id}`, { status: b.dataset.status }, token); return refresh(); }
      if (act === "offer-for") {
        const i = d.inquiries.find((x) => x.id == id);
        return packageSheet(null, { offer: true, offerFor: i.company || i.name, name: `${i.company || i.name} Wellness`, inquiry: i });
      }
      if (act === "copy") { navigator.clipboard?.writeText(b.dataset.text); toast("Link copied"); return; }
    } catch (x) { toast(x.message); b.disabled = false; }
  };

  // ---------- Schedule ----------
  function lessonRow(l, closing) {
    return `<div class="item">
      <div class="grow"><div class="when">${fmtWhen(l.startsAt, tz())}</div>
        <div class="muted small"><a href="#" data-act="client" data-id="${l.clientId}">${esc(l.clientName)}</a>${l.kind === "group" ? ` · <span class="pill accent">Group of ${l.partySize}</span>` : ""}${l.note ? " · " + esc(l.note) : ""}</div></div>
      ${closing ? `
        <button class="sm primary" data-act="close" data-status="completed" data-id="${l.id}">Done</button>
        <button class="sm" data-act="close" data-status="no_show" data-id="${l.id}">No-show</button>
        <button class="sm" data-act="close" data-status="late_cancel" data-id="${l.id}">Late cancel</button>
        <button class="sm" data-act="close" data-status="canceled" data-id="${l.id}">Canceled</button>` : `
        <button class="sm" data-act="coach-move" data-id="${l.id}">Move</button>
        <button class="sm" data-act="close" data-status="late_cancel" data-id="${l.id}" title="Client canceled too late; counts as used">Late cancel</button>
        <button class="sm danger" data-act="close" data-status="canceled" data-id="${l.id}">Cancel</button>`}
    </div>`;
  }
  function viewSchedule(v) {
    const now = Date.now();
    const booked = d.lessons.filter((l) => l.status === "booked");
    const toClose = booked.filter((l) => Date.parse(l.startsAt) <= now);
    const upcoming = booked.filter((l) => Date.parse(l.startsAt) > now);
    const groups = {};
    for (const l of upcoming) (groups[localDate(Date.parse(l.startsAt), tz())] ||= []).push(l);
    const recent = d.lessons.filter((l) => l.status !== "booked" && Date.parse(l.startsAt) <= now).reverse().slice(0, 15);
    v.innerHTML = `
      ${toClose.length ? `<div class="section" style="margin-top:0"><h2>Close out <span class="pill warn">${toClose.length}</span></h2>
        <p class="muted small">Marking a lesson done, no-show or late cancel releases that lesson's share of the package to you.</p>
        <div class="list">${toClose.map((l) => lessonRow(l, true)).join("")}</div></div>` : ""}
      <div class="section" style="margin-top:0">
        <div class="row spread"><h2 style="margin:0">Upcoming</h2><button class="sm primary" data-act="coach-book">Book for a client</button></div>
        <div style="margin-top:12px">${Object.keys(groups).length ? Object.entries(groups).map(([day, ls]) => `
          <h3 class="muted" style="margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em">${fmtDay(ls[0].startsAt, tz())}</h3>
          <div class="list">${ls.map((l) => lessonRow(l, false)).join("")}</div>`).join("") : `<div class="list"><div class="empty">No upcoming lessons.</div></div>`}</div>
      </div>
      ${recent.length ? `<div class="section"><h2>Recent</h2><div class="list">${recent.map((l) => `
        <div class="item"><div class="grow"><div>${fmtWhen(l.startsAt, tz())}</div><div class="muted small">${esc(l.clientName)}</div></div>
        ${statusPill(l.status)}${l.releaseStatus === "sent" ? `<span class="pill ok">Paid out</span>` : l.releaseStatus === "pending" || l.releaseStatus === "failed" ? `<span class="pill warn">Payout ${l.releaseStatus === "failed" ? "failed" : "waiting"}</span>` : ""}</div>`).join("")}</div></div>` : ""}`;
  }

  async function closeLesson(id, status) {
    const l = d.lessons.find((x) => x.id == id);
    const msgs = {
      completed: "Mark this lesson done? Its share of the package is released to you.",
      no_show: "Mark as a no-show? The lesson counts as used and its share is released to you.",
      late_cancel: "Mark as a late cancel? The lesson counts as used and its share is released to you.",
      canceled: "Cancel this lesson? It goes back on the client's balance and nothing is released.",
    };
    if (!(await confirmSheet(STATUS[status][0], `<strong>${esc(l.clientName)}</strong> · ${esc(fmtWhen(l.startsAt, tz()))}<br><br>${msgs[status]}`, "Confirm"))) return;
    try {
      const r = await api("POST", `/coach/lessons/${id}/status`, { status }, token);
      toast(r.sent?.sent ? "Done. Payout sent" : r.sent?.waiting ? "Done. Payout waits until you connect Stripe" : "Saved");
      refresh();
    } catch (x) { toast(x.message); }
  }

  function offlineSheet(c) {
    if (!d.packages.length) return toast("Create a package first.");
    sheet("Package paid in person", `<form>
      <p class="muted">For cash, Zelle or Venmo. ${esc(c.name)} gets the lessons; nothing is held since you already have the money.</p>
      <div class="field"><label for="op-pkg">Package</label><select id="op-pkg" name="packageId">${d.packages.map((p) => `<option value="${p.id}">${esc(p.name)}: ${p.lessonCount} lesson${p.lessonCount > 1 ? "s" : ""}, ${money(p.priceCents)}${p.kind === "group" ? " per person" : ""}</option>`).join("")}</select></div>
      <div class="field" id="op-ppl-f"><label for="op-ppl">People in the group</label><input id="op-ppl" name="people" type="number"></div>
      <div class="field"><label for="op-amt">Amount received ($)</label><input id="op-amt" name="amount" type="number" min="0" step="0.01"></div>
      <button class="primary block" type="submit">Add package</button><p class="err"></p></form>`, (body, close) => {
      const sync = (resetPeople) => {
        const pkg = d.packages.find((p) => p.id == $("#op-pkg").value);
        const isGroup = pkg.kind === "group";
        $("#op-ppl-f").classList.toggle("hidden", !isGroup);
        if (resetPeople) Object.assign($("#op-ppl"), { min: pkg.minPeople, max: pkg.maxPeople, value: pkg.minPeople });
        const people = isGroup ? +$("#op-ppl").value || pkg.minPeople : 1;
        $("#op-amt").value = (pkg.priceCents * people / 100).toFixed(2);
      };
      $("#op-pkg").onchange = () => sync(true);
      $("#op-ppl").oninput = () => sync(false);
      sync(true);
      handleForm($("form", body), async (f) => {
        await api("POST", "/coach/purchases/offline", { clientId: c.id, packageId: +f.packageId, people: f.people ? +f.people : undefined, amountCents: Math.round(parseFloat(f.amount) * 100) }, token);
        close(); toast("Package added"); refresh();
      });
    });

      : `<div class="row spread"><div class="grow"><strong>Connect your bank to get paid.</strong><div class="muted small">Stripe asks for your bank account and identity details. Released lessons wait here until it's connected.</div></div><button class="primary" data-act="connect">${d.coach.stripeConnected ? "Finish Stripe setup" : "Connect payouts"}</button></div>`;
    v.innerHTML = `
      <div class="stats">
        <div class="card stat"><div class="l">Held for future lessons</div><div class="n">${money(m.heldCents)}</div><div class="muted small">Paid by clients, not yet earned</div></div>
        <div class="card stat"><div class="l">Paid out this month</div><div class="n">${money(m.sentMonthCents)}</div><div class="muted small">${money(m.sentTotalCents)} all time</div></div>
        <div class="card stat"><div class="l">On its way</div><div class="n">${money(m.releasingCents)}</div><div class="muted small">${m.releasingCents ? `<a href="#" data-act="send">Send now</a>` : "Nothing waiting"}</div></div>
        <div class="card stat"><div class="l">Paid in person this month</div><div class="n">${money(m.offlineMonthCents)}</div><div class="muted small">Cash, Zelle, Venmo</div></div>
      </div>
      <div class="card" style="margin-top:14px">${stripeBlock}</div>
      ${expired.length ? `<div class="banner" style="margin-top:14px">${expired.length} expired package${expired.length > 1 ? "s" : ""} still ${expired.length > 1 ? "have" : "has"} money held. Refund it or keep it below.</div>` : ""}
      <div class="section"><h2>Packages with money held</h2>
        <div class="list">${held.length ? held.map((p) => {
          const expired = p.expiresAt && Date.parse(p.expiresAt) < Date.now();
          return `<div class="item">
            <div class="grow"><div class="when">${esc(p.clientName)} · ${money(p.heldCents)} held</div>
              <div class="muted small">${esc(p.packageName)} · ${p.lessonsUsed}/${p.lessonsTotal} lessons used · ${money(p.amountCents)} paid${p.expiresAt ? ` · use by ${fmtDate(p.expiresAt, tz())}` : ""}</div></div>
            ${expired ? `<span class="pill warn">Expired</span><button class="sm" data-act="keep" data-id="${p.id}">Keep</button>` : ""}
            <button class="sm danger" data-act="refund" data-id="${p.id}">Refund</button></div>`;
        }).join("") : `<div class="empty">Nothing held right now.</div>`}</div>
      </div>
      <div class="section"><h2>Payout history</h2>
        <div class="list">${d.releases.length ? d.releases.map((r) => `<div class="item">
          <div class="grow"><div class="when">${money(r.amountCents - r.feeCents)} · ${esc(r.clientName)}</div>
            <div class="muted small">${r.kind === "forfeit" ? "Unused balance kept" : r.lessonAt ? "Lesson " + fmtDay(r.lessonAt, tz()) : "Lesson"} · ${esc(r.packageName)}${r.feeCents ? ` · ${money(r.feeCents)} fee` : ""} · ${fmtDate(r.sentAt || r.createdAt, tz())}</div>
            ${r.status === "failed" ? `<div class="small" style="color:var(--danger)">${esc(r.error)}</div>` : ""}</div>
          ${{ sent: `<span class="pill ok">Paid out</span>`, pending: `<span class="pill warn">Waiting</span>`, failed: `<span class="pill danger">Failed</span>`, not_held: `<span class="pill">Paid in person</span>` }[r.status]}
        </div>`).join("") : `<div class="empty">Payouts show up here as you close out lessons.</div>`}</div>
      </div>
      <div class="card small muted">
        <h3 style="color:var(--text)">How the hold works</h3>
        <p>When a client buys a package by card, the money stays with Stripe instead of landing in your account all at once.</p>
        <p>Each time you mark a lesson <em>Done</em>, <em>No-show</em> or <em>Late cancel</em>, that lesson's share (package price ÷ lessons) is sent to your bank.</p>
        <p style="margin:0">If a package expires with lessons unused, you choose: <em>Keep</em> the rest or <em>Refund</em> it to the client.</p>
      </div>`;
  }

  async function refund(p) {
    if (!(await confirmSheet("Refund package?", `${esc(p.clientName)} · ${esc(p.packageName)}<br><br>Refunds the <strong>${money(p.heldCents)}</strong> still held${p.method === "card" ? " to their card" : ""} and cancels any upcoming lessons from this package. Lessons already done stay paid to you.`, "Refund"))) return;
    try { const r = await api("POST", `/coach/purchases/${p.id}/refund`, {}, token); toast(`Refunded ${money(r.refundedCents)}`); refresh(); }
    catch (x) { toast(x.message); }

    if (!(await confirmSheet("Keep unused balance?", `${esc(p.clientName)}'s package expired with ${money(p.heldCents)} unused. Release it to you?`, "Keep it"))) return;
    try { await api("POST", `/coach/purchases/${p.id}/keep-balance`, {}, token); toast("Released to you"); refresh(); }
    catch (x) { toast(x.message); }
  }
